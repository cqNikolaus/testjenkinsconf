jobs:
  - script: >
      folder('PetClinic') {
        displayName('PetClinic')
        description('Folder containing PetClinic')
      }

      folder('Samples') {
        displayName('Samples')
        description('Folder containing Samples')
      }

      pipelineJob('Samples/Coverage') {
        definition {
          cps {
            script("""
              pipeline {
                agent {
                  docker {
                    image 'maven:3.8.8-eclipse-temurin-8'
                    args '-u root:root'
                  }
                }
                stages {
                  stage('Checkout') {
                    steps {
                      git(
                        url: 'https://github.com/cqNikolaus/petclinic',
                        branch: 'musterloesung'
                      )
                    }
                  }
                  stage('Test & Coverage') {
                    steps {
                      sh 'mvn clean verify'
                      recordCoverage(
                        tools: [[parser: 'JACOCO', pattern: 'target/site/jacoco/jacoco.xml']],
                        sourceCodeRetention: 'LAST_BUILD'
                      )
                    }
                  }
                }
              }
            """)
          }
        }
      }

      pipelineJob('Samples/EvoSuite') {
        definition {
          cps {
            script("""
              pipeline {
                agent any
                stages {
                  stage('Checkout') {
                    steps {
                      git url: 'https://github.com/cqNikolaus/petclinic', branch: 'musterloesung'
                    }
                  }
                  stage('Build') {
                    steps {
                      sh 'mvn clean compile'
                    }
                  }
                  stage('Generate Tests with EvoSuite') {
                    steps {
                      sh '''
                        java -jar evosuite-master-1.2.0.jar -class <package.name.ClassName> -projectCP target/classes
                      '''
                    }
                  }
                  stage('Run Tests') {
                    steps {
                      sh 'mvn test'
                    }
                  }
                  stage('Push Generated Tests') {
                    steps {
                      withCredentials([
                        usernamePassword(credentialsId: 'github-credentials', usernameVariable: 'GH_USER', passwordVariable: 'GH_PASS')
                      ]) {
                        sh '''
                          git config user.name "cqNikolaus"
                          git config user.email "clemens.nikolaus@comquent.de"
                          git add src/test/java/
                          git commit -m "Add generated tests by EvoSuite"
                          git push https://$GH_USER:$GH_PASS@github.com/cqNikolaus/petclinic.git
                        '''
                      }
                    }
                  }
                }
              }
            """)
          }
        }
      }

      pipelineJob('Samples/Musterloesung') {
              definition {
                cpsScm {
                  scm {
                    git {
                      remote {
                        name('origin')
                        url('https://gitlab.comquent.academy/tn00/petclinic.git')
                      }
                      branch('musterloesung')
                    }
                  }
                }
              }
            }

      pipelineJob('Samples/Parallel') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  name('origin')
                  url('https://gitlab.comquent.academy/tn00/petclinic.git')
                }
                branch('musterloesung')
              }
            }
            scriptPath('Jenkinsfile_parallel')
          }
        }
      }

      pipelineJob('Samples/Docker') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  name('origin')
                  url('https://gitlab.comquent.academy/tn00/petclinic.git')
                }
                branch('docker')
              }
            }
          }
        }
      }