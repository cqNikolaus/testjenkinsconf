jobs:
  - script: >
      folder('PetClinic') {
        displayName('PetClinic')
        description('Folder containing PetClinic')
      }

      folder('Samples') {
        displayName('Samples')
        description('Folder containing Samples')
      }

      pipelineJob('Samples/Coverage') {
        definition {
          cps {
            script("""
              pipeline {
                agent {
                  docker {
                    image 'maven:3.8.8-eclipse-temurin-8'
                    args '-u root:root'
                  }
                }
                stages {
                  stage('Checkout') {
                    steps {
                      git(
                        url: 'https://github.com/cqNikolaus/petclinic',
                        branch: 'musterloesung'
                      )
                    }
                  }
                  stage('Test & Coverage') {
                    steps {
                      sh 'mvn clean verify'
                      recordCoverage(
                        tools: [[parser: 'JACOCO', pattern: 'target/site/jacoco/jacoco.xml']],
                        sourceCodeRetention: 'LAST_BUILD'
                      )
                    }
                  }
                }
              }
            """)
          }
        }
      }

      pipelineJob('Samples/Randoop') {
        definition {
          cps {
            script("""
              pipeline {
                agent {
                  docker {
                    image 'maven:3.8.8-eclipse-temurin-8'
                    args '-u root:root'
                  }
                }
                stages {
                  stage('Checkout') {
                    steps {
                      git(
                        url: 'https://github.com/cqNikolaus/petclinic',
                        branch: 'musterloesung'
                      )
                    }
                  }
                  stage('Configure Git Safe Directory') {
                    steps {
                      sh '''
                        git config --global --add safe.directory "\$WORKSPACE"
                      '''
                    }
                  }
                  stage('Install Randoop') {
                    steps {
                      sh '''
                        apt-get update && apt-get install -y wget unzip
                        wget https://github.com/randoop/randoop/releases/download/v4.3.0/randoop-4.3.0.zip -O randoop.zip
                        unzip -o randoop.zip -d randoop
                      '''
                    }
                  }
                  stage('Build Project') {
                    steps {
                      sh '''
                        mvn clean package
                      '''
                    }
                  }
                  stage('Generate Tests with Randoop') {
                    steps {
                      sh '''
                        # Randoop für das gesamte Projekt (petclinic.jar)
                        # time-limit=120 -> 2 Minuten (anpassbar)
                        java -cp "randoop/randoop-4.3.0.jar:target/petclinic.jar" randoop.main.Main gentests \\
                          --testjar=target/petclinic.jar \\
                          --time-limit=600 \\
                          --junit-output-dir=src/test/java
                      '''
                    }
                  }
                  stage('Push Generated Tests') {
                    steps {
                      withCredentials([
                        usernamePassword(
                          credentialsId: 'github-credentials',
                          usernameVariable: 'GH_USER',
                          passwordVariable: 'GH_PASS'
                        )
                      ]) {
                        sh '''
                          echo "Committing and pushing Randoop tests..."
                          git config user.name "cqNikolaus"
                          git config user.email "clemens.nikolaus@comquent.de"
                          git remote set-url origin "https://\$GH_USER:\$GH_PASS@github.com/cqNikolaus/petclinic.git"
                          git add src/test/java
                          git commit -m "Add Randoop tests"
                          git push origin HEAD
                        '''
                      }
                    }
                  }
                }
              }
            """)
          }
        }
      }

      pipelineJob('Samples/Musterloesung') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  name('origin')
                  url('https://gitlab.comquent.academy/tn00/petclinic.git')
                }
                branch('musterloesung')
              }
            }
          }
        }
      }

      pipelineJob('Samples/Parallel') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  name('origin')
                  url('https://gitlab.comquent.academy/tn00/petclinic.git')
                }
                branch('musterloesung')
              }
            }
            scriptPath('Jenkinsfile_parallel')
          }
        }
      }

      pipelineJob('Samples/Docker') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  name('origin')
                  url('https://gitlab.comquent.academy/tn00/petclinic.git')
                }
                branch('docker')
              }
            }
          }
        }
      }
