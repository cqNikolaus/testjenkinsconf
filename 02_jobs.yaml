jobs:
  - script: >
      folder('PetClinic') {
        displayName('PetClinic')
        description('Folder containing PetClinic')
      }

      folder('Samples') {
        displayName('Samples')
        description('Folder containing Samples')
      }

      pipelineJob('Samples/Coverage') {
        definition {
          cps {
            script("""
              pipeline {
                agent {
                  docker {
                    image 'maven:3.8.8-eclipse-temurin-8'
                    args '-u root:root'
                  }
                }
                stages {
                  stage('Checkout') {
                    steps {
                      git(
                        url: 'https://github.com/cqNikolaus/petclinic',
                        branch: 'musterloesung'
                      )
                    }
                  }
                  stage('Test & Coverage') {
                    steps {
                      sh 'mvn clean verify'
                      recordCoverage(
                        tools: [[parser: 'JACOCO', pattern: 'target/site/jacoco/jacoco.xml']],
                        sourceCodeRetention: 'LAST_BUILD'
                      )
                    }
                  }
                }
              }
            """)
          }
        }
      }

      pipelineJob('Samples/Qodo-Cover') {
        definition {
          cps {
            script("""
              pipeline {
                agent {
                  docker {
                    image 'maven:3.8.8-eclipse-temurin-8'
                    args '-u root:root'
                  }
                }
                stages {
                  stage('Checkout') {
                    steps {
                      git(
                        url: 'https://github.com/cqNikolaus/petclinic',
                        branch: 'musterloesung'
                      )
                    }
                  }
                  stage('Configure Git Safe Directory') {
                    steps {
                      sh '''
                        git config --global --add safe.directory "\$WORKSPACE"
                      '''
                    }
                  }
                  stage('Install Qodo-Cover') {
                    steps {
                      sh 'apt-get update && apt-get install -y python3-pip'
                      sh 'pip install git+https://github.com/qodo-ai/qodo-cover.git'
                    }
                  }
                  stage('Generate & Verify Coverage') {
                    steps {
                      withCredentials([
                        string(credentialsId: 'openai-api-key', variable: 'OPENAI_API_KEY')
                      ]) {
                        sh '''
                          echo "Erzeuge Jacoco Coverage (mvn clean verify) und generiere Tests via Qodo-Cover..."
                          mvn clean verify

                          cover-agent \
                            --source-file-path "src/main/java/org/springframework/samples/petclinic" \
                            --test-file-path "src/test/java/org/springframework/samples/petclinic" \
                            --code-coverage-report-path "target/site/jacoco/jacoco.xml" \
                            --test-command "mvn clean verify" \
                            --project-path "." \
                            --api-key "\$OPENAI_API_KEY" \
                            --coverage-type "jacoco" \
                            --coverage-path "target/site/jacoco/jacoco.xml" \
                            --desired-coverage 95
                        '''
                      }
                    }
                  }
                  stage('Push Results') {
                    steps {
                      withCredentials([
                        usernamePassword(
                          credentialsId: 'github-credentials',
                          usernameVariable: 'GH_USER',
                          passwordVariable: 'GH_PASS'
                        )
                      ]) {
                        sh '''
                          git config user.name "cqNikolaus"
                          git config user.email "clemens.nikolaus@comquent.de"
                          git remote set-url origin "https://\$GH_USER:\$GH_PASS@github.com/cqNikolaus/petclinic.git"
                          git add .
                          git commit -m "Add generated tests from Qodo-Cover"
                          git push origin HEAD
                        '''
                      }
                    }
                  }
                }
              }
            """)
          }
        }
      }


      pipelineJob('Samples/Musterloesung') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  name('origin')
                  url('https://gitlab.comquent.academy/tn00/petclinic.git')
                }
                branch('musterloesung')
              }
            }
          }
        }
      }

      pipelineJob('Samples/Parallel') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  name('origin')
                  url('https://gitlab.comquent.academy/tn00/petclinic.git')
                }
                branch('musterloesung')
              }
            }
            scriptPath('Jenkinsfile_parallel')
          }
        }
      }

      pipelineJob('Samples/Docker') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  name('origin')
                  url('https://gitlab.comquent.academy/tn00/petclinic.git')
                }
                branch('docker')
              }
            }
          }
        }
      }
