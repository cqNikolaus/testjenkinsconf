jobs:
  - script: >
      folder('PetClinic') {
        displayName('PetClinic')
        description('Folder containing PetClinic')
      }

      folder('Samples') {
        displayName('Samples')
        description('Folder containing Samples')
      }

      pipelineJob('Samples/Coverage') {
        definition {
          cps {
            script("""
              pipeline {
                agent {
                  docker {
                    image 'maven:3.8.8-eclipse-temurin-8'
                    args '-u root:root'
                  }
                }
                stages {
                  stage('Checkout') {
                    steps {
                      git(
                        url: 'https://github.com/cqNikolaus/petclinic',
                        branch: 'musterloesung'
                      )
                    }
                  }
                  stage('Test & Coverage') {
                    steps {
                      sh 'mvn clean verify'
                      recordCoverage(
                        tools: [[parser: 'JACOCO', pattern: 'target/site/jacoco/jacoco.xml']],
                        sourceCodeRetention: 'LAST_BUILD'
                      )
                    }
                  }
                }
              }
            """)
          }
        }
      }

      pipelineJob('Samples/Qodo-Cover') {
        definition {
          cps {
            script("""
              pipeline {
                agent {
                  docker {
                    image 'maven:3.8.8-eclipse-temurin-8'
                    args '-u root:root'
                  }
                }
                stages {
                  stage('Checkout') {
                    steps {
                      git(
                        url: 'https://github.com/cqNikolaus/petclinic',
                        branch: 'musterloesung'
                      )
                    }
                  }
                  stage('Configure Git Safe Directory') {
                    steps {
                      sh '''
                        git config --global --add safe.directory "\$WORKSPACE"
                      '''
                    }
                  }
                  stage('Install Tools') {
                    steps {
                      sh '''
                        apt-get update && apt-get install -y python3-pip
                        pip install poetry
                        cat <<EOF > pyproject.toml
                  [tool.poetry]
                  name = "cover-agent"
                  version = "0.0.0"
                  description = "Cover Agent Tool"
                  authors = ["QodoAI"]
                  license = "AGPL-3.0 license"
                  readme = "README.md"
                  [tool.poetry.dependencies]
                  python = "^3.9"
                  EOF

                        # Qodo-Cover installieren
                        poetry add git+https://github.com/qodo-ai/qodo-cover.git
                      '''
                    }
                  }
                  stage('Full Repo Coverage') {
                    steps {
                      withCredentials([
                        string(credentialsId: 'openai-api-key', variable: 'OPENAI_API_KEY')
                      ]) {
                        sh '''
                          poetry run cover-agent-full-repo \
                            --project-language="java" \
                            --project-root="." \
                            --code-coverage-report-path="target/site/jacoco/jacoco.xml" \
                            --test-command="mvn clean verify" \
                            --coverage-type="jacoco" \
                            --desired-coverage=95 \
                            --model=gpt-4o \
                        '''
                      }
                    }
                  }
                  stage('Push Results') {
                    steps {
                      withCredentials([
                        usernamePassword(
                          credentialsId: 'github-credentials',
                          usernameVariable: 'GH_USER',
                          passwordVariable: 'GH_PASS'
                        )
                      ]) {
                        sh '''
                          git config user.name "cqNikolaus"
                          git config user.email "clemens.nikolaus@comquent.de"
                          git remote set-url origin "https://\$GH_USER:\$GH_PASS@github.com/cqNikolaus/petclinic.git"
                          git add .
                          git commit -m "Add generated tests from Qodo-Cover"
                          git push origin HEAD
                        '''
                      }
                    }
                  }
                }
              }
            """)
          }
        }
      }


      pipelineJob('Samples/Musterloesung') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  name('origin')
                  url('https://gitlab.comquent.academy/tn00/petclinic.git')
                }
                branch('musterloesung')
              }
            }
          }
        }
      }

      pipelineJob('Samples/Parallel') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  name('origin')
                  url('https://gitlab.comquent.academy/tn00/petclinic.git')
                }
                branch('musterloesung')
              }
            }
            scriptPath('Jenkinsfile_parallel')
          }
        }
      }

      pipelineJob('Samples/Docker') {
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  name('origin')
                  url('https://gitlab.comquent.academy/tn00/petclinic.git')
                }
                branch('docker')
              }
            }
          }
        }
      }
